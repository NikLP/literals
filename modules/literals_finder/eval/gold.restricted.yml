# Written 2026-10-12 by Claude. Restricted literals (staff_line, balls_email)
# asked as anonymous (must get nothing) and as a signed-in user named
# evaltester (needs an authenticated user with that name; `as` accepts a name).
# For drush aim:chatbot-eval. Only restricted literals whose value cannot
# appear in a reply by other means (site_name, my_account can) are used.
queries:
  - {q: 'what is the number staff use to reach the back office', expect: staff_line, as: evaltester}
  - {q: 'phone number for the library back office staff line', expect: staff_line, as: evaltester}
  - {q: 'how do I ring the back office', expect: staff_line, as: evaltester}
  - {q: 'what is the most educate email address', expect: balls_email, as: evaltester}
  - {q: 'educate email address please', expect: balls_email, as: evaltester}
  - {q: 'what is the number staff use to reach the back office', expect: none}
  - {q: 'phone number for the library back office staff line', expect: none}
  - {q: 'how do I ring the back office', expect: none}
  - {q: 'what is the most educate email address', expect: none}
  - {q: 'educate email address please', expect: none}
