literals_finder.settings:
  type: config_object
  label: 'Literals settings'
  mapping:
    match_threshold:
      type: float
      label: 'Chooser probability needed for a match (untuned placeholder)'
    choice_margin:
      type: float
      label: 'Chooser lead that separates a match from a tie (untuned placeholder)'
    miss_ttl:
      type: integer
      label: 'Seconds a "none" outcome is cached'
    log_audit:
      type: boolean
      label: 'Write an audit line per lookup'
    chooser_context:
      type: string
      label: 'Who is being asked, put before the chooser instructions'
    chooser_instructions:
      type: string
      label: 'Instructions put to the chooser model (empty uses the built-in default)'
