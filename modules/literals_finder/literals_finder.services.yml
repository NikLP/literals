services:
  literals_finder.chooser:
    class: Drupal\literals_finder\Finder\LiteralChooser
    arguments: ['@ai.provider', '@config.factory']

  literals_finder.finder:
    class: Drupal\literals_finder\Finder\LiteralFinder
    arguments:
      - '@entity_type.manager'
      - '@current_user'
      - '@literals_finder.chooser'
      - '@cache.default'
      - '@config.factory'
      - '@logger.channel.literals'
  Drupal\literals_finder\Finder\LiteralFinderInterface: '@literals_finder.finder'

  literals.guardrails:
    class: Drupal\literals_finder\Finder\LiteralGuardrails
    arguments: ['@Drupal\ai\Guardrail\AiGuardrailRepository', '@ai.provider']
