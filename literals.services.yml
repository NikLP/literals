services:
  plugin.manager.literal_resolver:
    class: Drupal\literals\LiteralResolverManager
    parent: default_plugin_manager

  logger.channel.literals:
    class: Drupal\Core\Logger\LoggerChannel
    factory: logger.factory:get
    arguments: ['literals']

  literals.reader:
    class: Drupal\literals\LiteralReader
    arguments: ['@entity_type.manager', '@current_user', '@config.factory', '@logger.channel.literals']

  literals.search:
    class: Drupal\literals\LiteralSearch
    arguments: ['@entity_type.manager', '@current_user']

  Drupal\literals\Hook\LiteralsHooks:
    class: Drupal\literals\Hook\LiteralsHooks
    arguments: ['@literals.reader', '@token', '@current_user', '@entity_type.manager']

  literals.lookup:
    class: Drupal\literals\LiteralLookup
    arguments: ['@literals.reader', '@literals.search', '@current_user', '@?literals_finder.finder']
