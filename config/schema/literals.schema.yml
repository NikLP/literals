literals.literal_type.*:
  type: config_entity
  label: 'Literal type'
  mapping:
    id:
      type: string
      label: 'ID'
    label:
      type: label
      label: 'Label'
    description:
      type: text
      label: 'Description'
    resolver:
      type: string
      label: 'Resolver'
      constraints:
        PluginExists:
          manager: plugin.manager.literal_resolver
          interface: '\Drupal\literals\LiteralResolverInterface'
    validate_as:
      type: string
      label: 'Validate as'

views.filter.literal_audience:
  type: views.filter.in_operator
  label: 'Literal audience'

literals.settings:
  type: config_object
  label: 'Literals settings'
  mapping:
    log_audit:
      type: boolean
      label: 'Log audit lines (writes and reads: IDs, keys, outcomes; never gists or values)'
