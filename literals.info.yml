name: Literals
type: module
description: 'Exact values (a phone number, a URL) found by a plain-language description, never guessed.'
package: AIM
core_version_requirement: ^11
dependencies:
  - drupal:user
  - drupal:views
config_devel:
  install:
    - literals.literal_type.entity
    - literals.literal_type.phone
    - literals.literal_type.text
    - literals.literal_type.field
    - literals.literal_type.token
    - literals.literal_type.url
    - literals.settings
    - views.view.literals
