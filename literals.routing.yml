literals.admin_config:
  path: '/admin/config/literals'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'Literals'
  requirements:
    _permission: 'administer literals'

literals.search_autocomplete:
  path: '/literals/search/autocomplete'
  defaults:
    _controller: '\Drupal\literals\Controller\LiteralSearchController::autocomplete'
  methods: [GET]
  requirements:
    _permission: 'search literals'
