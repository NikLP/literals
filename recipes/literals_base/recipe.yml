name: 'Literals: base'
description: 'Installs literals and lets everyone see unrestricted literals; restricted ones need a staff role granted `view restricted literals`.'
type: 'Configuration'
install:
  - literals
config:
  # A recipe-installed module is installed in syncing mode, so its own
  # config/install is skipped; import it explicitly.
  import:
    literals: '*'
  actions:
    user.role.anonymous:
      grantPermissions:
        - 'view literals'
    user.role.authenticated:
      grantPermissions:
        - 'view literals'
