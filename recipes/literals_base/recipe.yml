name: 'Literals: base'
description: 'Installs literals and lets everyone see unrestricted literals; signed-in users see restricted ones too.'
type: 'Configuration'
install:
  - literals
config:
  actions:
    user.role.anonymous:
      grantPermissions:
        - 'view literals'
    user.role.authenticated:
      grantPermissions:
        - 'view literals'
        - 'view restricted literals'
