name: 'Literals: base'
description: 'Installs literals and lets everyone see unrestricted literals and signed-in users see restricted ones too. Nothing is granted on install, so this is where a site makes that choice.'
type: 'Configuration'
install:
  - literals
config:
  actions:
    user.role.anonymous:
      grantPermissions:
        - 'view literals'
    user.role.authenticated:
      grantPermissions:
        - 'view literals'
        - 'view restricted literals'
