name: 'Literals: base'
description: 'Installs literals and lets anonymous visitors see anonymous-audience literals and signed-in users see anonymous and authenticated ones. Nothing is granted on install, so this is where a site makes that choice.'
type: 'Configuration'
install:
  - literals
config:
  actions:
    user.role.anonymous:
      grantPermissions:
        - 'view anonymous literals'
    user.role.authenticated:
      grantPermissions:
        - 'view anonymous literals'
        - 'view authenticated literals'
