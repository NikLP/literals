name: 'Literals: demo library'
description: 'Demo literals for the fictional Harbourside Community Library demo.'
type: 'Demo'
install:
  - literals
  - literals_finder
  - literals_chat
  - ai_chatbot
  - block
config:
  # A recipe-installed module is installed in syncing mode, so its own
  # config/install is skipped; import it explicitly.
  import:
    literals: '*'
    literals_finder: '*'
  actions:
    # Everyone sees unrestricted literals; restricted ones need a staff role
    # granted `view restricted literals`.
    user.role.anonymous:
      grantPermissions:
        - 'view literals'
    user.role.authenticated:
      grantPermissions:
        - 'view literals'
        - 'use literals chat'
        - 'access deepchat api'
    block.block.literals_demo_chat:
      placeBlockInDefaultTheme:
        plugin: ai_deepchat_block
        region: content
        settings:
          label: 'Ask the library'
          label_display: visible
          chat_processor_plugin: literals_chat_processor
          # The default placement (toolbar) needs the admin toolbar and does
          # not work on a front-end theme.
          placement: bottom-right
          bot_name: 'Library Assistant'
          first_message: "Hi! I'm the Harbourside Library assistant. I can give you the library's phone numbers and the links to sign in, check your account or reset your password."
